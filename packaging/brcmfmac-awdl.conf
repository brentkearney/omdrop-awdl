# Debug mask for the patched brcmfmac.
#
# The data-path gate in /usr/lib/omdrop/omdrop-discoverable decides "parked" vs
# "working" by counting the per-frame `awdl txstatus` lines the driver logs for
# a 20-frame probe. Those lines exist only in a CONFIG_BRCMDBG/-DDEBUG build AND
# only when the debug mask is set; with debug=0 the gate sees zero completions
# for a perfectly healthy radio and reports every window as parked.
#
# 0x1000 is the AWDL bit. It is per-frame only for AWDL traffic, so an idle
# awdl0 logs almost nothing and a transfer logs on the order of the frame count
# -- bounded by the dmesg ring, not written to disk unless the journal is
# picking up kernel messages.
options brcmfmac debug=0x1000
