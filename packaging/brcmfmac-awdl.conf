# Debug mask for the patched brcmfmac.
#
# 0x1000 is BRCMF_FIL_VAL, the firmware-interface bit (debug.h); it is not an
# AWDL bit. The data-path gate in /usr/lib/omdrop/omdrop-discoverable doesn't
# depend on it: it counts the per-frame `awdl txstatus` lines that patch 0009
# prints through pr_info() while the awdl_trace parameter is set, and the
# gate sets that parameter itself for the seconds it probes. The "firmware
# error" lines the helper reads come from brcmf_err(), which ignores the mask.
options brcmfmac debug=0x1000
