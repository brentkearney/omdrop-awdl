# NetworkManager must not manage awdl0.
#
# A managed awdl0 is given a randomised MAC and no IPv6 link-local, and both
# are fatal: the AWDL address is what peers have in their firmware peer tables,
# and the link-local is the only address a transfer can be delivered to.
#
# This is the vendor copy. Override it by putting a file of the same name in
# /etc/NetworkManager/conf.d/, which NetworkManager reads after this one.
[keyfile]
unmanaged-devices=interface-name:awdl0
